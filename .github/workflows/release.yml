# Builds EasyEffects for Windows and publishes a release when VERSION changes.
#
#   1. Bump the version in VERSION (e.g. 0.2.0 -> 0.3.0) and push it to the
#      default branch (master).
#   2. This workflow builds the app, packages
#        EasyEffects-Windows-vX.Y.Z-Portable.zip  (portable, no install)
#        EasyEffects-Windows-vX.Y.Z-Setup.exe     (installer, updates itself)
#      and publishes them as release vX.Y.Z with generated release notes.
#
# On other branches the same build runs and the files are attached to the
# workflow run as artifacts, but nothing is released. A version that already
# has a tag is never released twice.

name: Release

on:
  push:
    paths:
      - VERSION
      - .github/workflows/release.yml
      - installer/**
      - scripts/package_release.ps1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION must look like 1.2.3, got '$v'" }
          $tag = "v$v"
          $tagExists = [bool](git ls-remote --tags origin "refs/tags/$tag")
          $onDefault = "${{ github.ref }}" -eq "refs/heads/${{ github.event.repository.default_branch }}"
          $release = $onDefault -and -not $tagExists
          "version=$v"      >> $env:GITHUB_OUTPUT
          "tag=$tag"        >> $env:GITHUB_OUTPUT
          "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v (tag $tag). Default branch: $onDefault. Tag exists: $tagExists. Release: $release"

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" "-DEE_UPDATE_REPO=${{ github.repository }}"

      - name: Build app
        run: cmake --build build --config Release --target EasyEffects_Standalone --parallel

      - name: Package portable zip
        shell: pwsh
        run: ./scripts/package_release.ps1 -Version "${{ steps.version.outputs.tag }}"

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
                  Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer\EasyEffects.iss `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DRootDir=$PWD" `
            "/DOutputDir=$PWD\releases" `
            "/DRepo=${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem releases

      - name: Upload build artifacts
        # Convenience copy on the workflow run; a hiccup here must not block the release.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: EasyEffects-Windows-${{ steps.version.outputs.tag }}
          path: |
            releases/*-Portable.zip
            releases/*-Setup.exe

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $files = Get-ChildItem releases -File | Where-Object { $_.Name -like "*-Portable.zip" -or $_.Name -like "*-Setup.exe" } |
                   ForEach-Object { $_.FullName }
          # GitHub occasionally refuses or drops a request (seen as HTTP 403 / 5xx),
          # so retry; if the release already exists from a partial attempt, just
          # (re)upload its files.
          $ok = $false
          for ($attempt = 1; $attempt -le 5 -and -not $ok; $attempt++) {
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag @files --clobber
            } else {
              gh release create $tag @files `
                --target "${{ github.sha }}" `
                --title "EasyEffects for Windows $tag" `
                --generate-notes `
                --latest
            }
            $ok = ($LASTEXITCODE -eq 0)
            if (-not $ok) { Write-Host "Attempt $attempt failed, retrying..."; Start-Sleep -Seconds (20 * $attempt) }
          }
          if (-not $ok) { throw "Publishing release $tag failed after 5 attempts" }
